<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3d66"><link rel="manifest" href="manifest.json"><title>SBSERVICE Presupuestos</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#182433}header{background:#0b3d66;color:white;padding:18px;text-align:center}.w{max-width:700px;margin:auto;padding:14px}.c{background:white;padding:16px;border-radius:14px;margin-bottom:14px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border-radius:9px;border:1px solid #ccd4dc;font:inherit}button{background:#0b3d66;color:white;border:0;font-weight:bold}.a{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum{font-size:22px;font-weight:bold;color:#0b3d66}@media(max-width:550px){.a{grid-template-columns:1fr}}@media print{.np{display:none}}</style></head><body><header><img src="logo.jpg" alt="SBSERVICE" style="width:150px;max-width:42vw;border-radius:50%;display:block;margin:0 auto 8px"><div>Presupuestos · 3624171540</div></header><main class="w"><section class="c np"><b>Buscar cliente</b><input id="q" placeholder="Nombre, teléfono o CLI-0001"><button onclick="search()">Buscar</button><div id="r"></div></section><section class="c"><h3>Nuevo presupuesto · <span id="pv"></span></h3><div class="a"><input id="date" type="date"><input id="cid" readonly placeholder="Nº cliente automático"></div><input id="name" placeholder="Cliente"><input id="phone" placeholder="Teléfono"><select id="eq"><option>Aire acondicionado</option><option>Heladera</option><option>Lavarropas</option><option>Anafe</option><option>Otro</option></select><input id="model" placeholder="Marca / modelo"><textarea id="job" placeholder="Trabajo / diagnóstico"></textarea><div class="a"><input id="parts" type="number" value="0" placeholder="Repuestos $"><input id="labor" type="number" value="0" placeholder="Mano de obra $"></div><input id="deposit" type="number" value="0" placeholder="Seña $"><p>Total: <span class="sum" id="total">$ 0</span><br>Saldo: <span class="sum" id="balance">$ 0</span></p><div class="a np"><button onclick="save()">Guardar</button><button onclick="print()">PDF / Imprimir</button></div><button class="np" onclick="wa()">WhatsApp</button></section><section class="c np"><h3>Últimos presupuestos</h3><div id="hist"></div></section></main><script>
const K='sbserviceDB';let d=JSON.parse(localStorage.getItem(K)||'{"clientes":[],"presupuestos":[],"clienteSeq":0,"presupuestoSeq":0}');d.clienteSeq=d.clienteSeq||d.clientes.length;d.presupuestoSeq=d.presupuestoSeq||d.presupuestos.length;const E=x=>document.getElementById(x),M=n=>'$ '+Number(n||0).toLocaleString('es-AR');function calc(){let t=+E('parts').value+ +E('labor').value;E('total').textContent=M(t);E('balance').textContent=M(Math.max(0,t- +E('deposit').value))}['parts','labor','deposit'].forEach(x=>E(x).oninput=calc);function search(){let q=E('q').value.toLowerCase(),c=d.clientes.find(x=>x.id.toLowerCase()==q||x.phone.includes(q)||x.name.toLowerCase().includes(q));if(c){E('cid').value=c.id;E('name').value=c.name;E('phone').value=c.phone;E('r').textContent='Cliente '+c.id+' cargado'}else E('r').textContent='No encontrado: se creará al guardar.'}function client(){let n=E('name').value.trim(),p=E('phone').value.trim(),c=d.clientes.find(x=>(p&&x.phone==p)||x.name.toLowerCase()==n.toLowerCase());if(c)return c;d.clienteSeq++;c={id:'CLI-'+String(d.clienteSeq).padStart(4,'0'),name:n,phone:p};d.clientes.push(c);return c}function save(){if(!E('name').value.trim()||!E('job').value.trim())return alert('Completá cliente y trabajo.');let c=client(),t=+E('parts').value+ +E('labor').value;d.presupuestoSeq++;let p={id:'PRE-'+String(d.presupuestoSeq).padStart(6,'0'),cid:c.id,name:c.name,phone:c.phone,date:E('date').value,eq:E('eq').value,model:E('model').value,job:E('job').value,total:t,deposit:+E('deposit').value,balance:Math.max(0,t- +E('deposit').value)};d.presupuestos.push(p);E('cid').value=c.id;localStorage.setItem(K,JSON.stringify(d));render();alert('Guardado: '+p.id)}function wa(){let t=+E('parts').value+ +E('labor').value,s=Math.max(0,t- +E('deposit').value),msg='SBSERVICE - Presupuesto\nCliente: '+E('name').value+'\nEquipo: '+E('eq').value+' '+E('model').value+'\nTrabajo: '+E('job').value+'\nTotal: '+M(t)+'\nSeña: '+M(E('deposit').value)+'\nSaldo: '+M(s)+'\nTel. SBSERVICE: 3624171540',p=E('phone').value.replace(/\D/g,'');if(p&&!p.startsWith('54'))p='54'+p;location.href='https://wa.me/'+p+'?text='+encodeURIComponent(msg)}function render(){E('pv').textContent='PRE-'+String(d.presupuestoSeq+1).padStart(6,'0');E('hist').innerHTML=[...d.presupuestos].reverse().slice(0,10).map(x=>'<p><b>'+x.id+'</b> · '+x.name+' ('+x.cid+') · '+M(x.total)+'</p>').join('')||'Sin presupuestos todavía.'}E('date').value=new Date().toISOString().slice(0,10);calc();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
